<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Results Checker - Skaitech</title>
  <link rel="icon" type="image/jpeg" href="img/akaitech%20more%20final%20logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .results-wrap {
      max-width: 540px;
      margin: 48px auto;
      padding: 0 18px;
    }
    .results-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 24px #0f172a16;
    }
    .results-card h1 {
      margin: 0 0 8px;
    }
    .results-card p {
      color: #64748b;
    }
    .field {
      margin: 16px 0;
    }
    .field label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .field input, .field select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      box-sizing: border-box;
    }
    .summary {
      display: flex;
      justify-content: space-between;
      background: #fefce8;
      border: 1px solid #fde68a;
      padding: 14px;
      border-radius: 8px;
      margin: 18px 0;
    }
    .pay-btn {
      width: 100%;
      background: #1e293b;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .notice {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
    }
    .notice.show {
      display: block;
      background: #eff6ff;
      color: #1e40af;
    }
    .notice.error {
      background: #fef2f2;
      color: #991b1b;
    }
    .pins {
      white-space: pre-wrap;
      background: #ecfdf5;
      color: #065f46;
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
    }
    .nav-links-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    .nav-links-bar a {
      color: #4b5563;
      text-decoration: none;
      font-weight: 600;
    }
    .nav-links-bar a:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <main class="results-wrap">
    <section class="results-card">
      <h1>Buy Results Checker PINs</h1>
      <p>Pay with your agent wallet balance. PINs are shown instantly after your wallet payment is confirmed.</p>
      <form id="resultsCheckerForm">
        <div class="field">
          <label for="examType">Exam type</label>
          <select id="examType">
            <option value="BECE">BECE</option>
            <option value="WASSCE">WASSCE</option>
            <option value="NOV/DEC">NOV/DEC</option>
          </select>
        </div>
        <div class="field">
          <label for="quantity">Quantity</label>
          <input id="quantity" type="number" value="1" min="1" max="10" required>
        </div>
        <div class="summary">
          <span>Price each: <b>GHS <span id="pricePerPin">19.00</span></b></span>
          <span>Total: <b>GHS <span id="totalPrice">19.00</span></b></span>
        </div>
        <div class="field">
          <label for="phoneNumber">Phone number</label>
          <input id="phoneNumber" type="tel" maxlength="10" placeholder="0XXXXXXXXX" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>
        <button class="pay-btn" type="submit">Pay with Wallet Balance</button>
      </form>
      <div id="notice" class="notice" role="status"></div>
      <div id="pins" class="pins" hidden></div>
    </section>
  </main>
  <script type="module" src="agentNav.js"></script>
  <script type="module" src="resultsChecker.js"></script>
</body>
</html>

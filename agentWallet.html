<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skaitech - Agent Wallet & Transactions</title>
    <link rel="icon" type="image/jpeg" href="img/akaitech%20more%20final%20logo.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding-bottom: 40px;">

    <!-- TOP NAVIGATION HEADER -->
    <div style="display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; margin-bottom: 20px;">
        <a href="dashboard.html" style="background: #1e293b; color: white; border: none; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600;">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
        <div style="font-weight: 700; color: #1e293b; font-size: 1rem;">My Wallet & Transactions</div>
        <div id="walletAgentInitials" style="background: #e2e8f0; color: #1e293b; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">
            SA
        </div>
    </div>

    <div style="padding: 0 16px; max-width: 600px; margin: 0 auto;">
        
        <!-- Action Deposit Buttons -->
        <div style="display: flex; gap: 10px; margin-bottom: 16px;">
            <button onclick="location.href='deposit.html'" style="flex: 1; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer;">Fund wallet securely</button>
            <button onclick="directDepositInfo()" style="flex: 1; background: #334155; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer;">Direct Deposit</button>
        </div>

        <!-- Financial Cards Grid -->
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;">
            
            <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); position: relative;">
                <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Balance</div>
                <div id="walletPageBalance" style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 4px;">GHS 0.00</div>
                <i class="fa-solid fa-wallet" style="position: absolute; right: 14px; top: 16px; color: #10b981; font-size: 1.1rem;"></i>
            </div>

            <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); position: relative;">
                <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Sales</div>
                <div style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 4px;">GHS 0.00</div>
                <i class="fa-solid fa-cart-shopping" style="position: absolute; right: 14px; top: 16px; color: #3b82f6; font-size: 1.1rem;"></i>
            </div>

            <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); position: relative;">
                <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Deposits</div>
                <div style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 4px;">GHS 0.00</div>
                <i class="fa-solid fa-arrow-down" style="position: absolute; right: 14px; top: 16px; color: #a855f7; font-size: 1.1rem;"></i>
            </div>

            <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); position: relative;">
                <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Overdraft</div>
                <div style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 4px;">GHS 0.00</div>
                <i class="fa-solid fa-triangle-exclamation" style="position: absolute; right: 14px; top: 16px; color: #ef4444; font-size: 1.1rem;"></i>
            </div>

            <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); position: relative;">
                <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Commission Balance</div>
                <div style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 4px;">GHS 0.00</div>
                <i class="fa-solid fa-wallet" style="position: absolute; right: 14px; top: 16px; color: #f59e0b; font-size: 1.1rem;"></i>
            </div>

            <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); position: relative;">
                <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Withdrawn commission</div>
                <div style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 4px;">GHS 0.00</div>
                <i class="fa-solid fa-wallet" style="position: absolute; right: 14px; top: 16px; color: #f59e0b; font-size: 1.1rem;"></i>
            </div>

            <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); position: relative;">
                <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Transferred commission</div>
                <div style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 4px;">GHS 0.00</div>
                <i class="fa-solid fa-right-left" style="position: absolute; right: 14px; top: 16px; color: #0ea5e9; font-size: 1.1rem;"></i>
            </div>

            <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); position: relative;">
                <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Total commission earned</div>
                <div style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 4px;">GHS 0.00</div>
                <i class="fa-solid fa-award" style="position: absolute; right: 14px; top: 16px; color: #8b5cf6; font-size: 1.1rem;"></i>
            </div>

            <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); position: relative; grid-column: span 2;">
                <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Store sales</div>
                <div style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 4px;">GHS 0.00</div>
                <i class="fa-solid fa-bag-shopping" style="position: absolute; right: 14px; top: 16px; color: #06b6d4; font-size: 1.1rem;"></i>
            </div>

        </div>

        <!-- Transactions Filter Area -->
        <div style="background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03);">
            <label style="font-size: 0.8rem; font-weight: 700; color: #374151; display: block; margin-bottom: 6px;">Transaction type</label>
            <select id="txTypeFilter" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 14px; outline: none; background: #f8fafc;">
                <option value="All">All</option>
                <option value="DEPOSIT">Deposits</option>
                <option value="PURCHASE">Purchases</option>
            </select>

            <label style="font-size: 0.8rem; font-weight: 700; color: #374151; display: block; margin-bottom: 6px;">Transaction ID</label>
            <input type="text" id="txIdFilter" placeholder="Filter by Transaction ID" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; outline: none; background: #f8fafc;">

            <div id="transactionResultsList" style="margin-top: 20px;">
                <div style="text-align: center; color: #94a3b8; font-size: 0.9rem; padding: 30px 0;">
                    No transactions found.
                </div>
            </div>
        </div>

    </div>

    <!-- Link Dedicated Wallet JavaScript -->
    <script type="module" src="agentWallet.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>

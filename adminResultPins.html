<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result PIN Stock - Skaitech</title><link rel="icon" type="image/jpeg" href="img/akaitech%20more%20final%20logo.jpeg"><style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#1e293b;margin:0}.wrap{max-width:650px;margin:45px auto;padding:24px;background:#fff;border-radius:14px;box-shadow:0 6px 22px #0f172a18}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:7px}select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:180px}button{padding:12px 16px;background:#1e293b;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}.notice{margin-top:16px;padding:12px;border-radius:8px;background:#eff6ff;color:#1e40af}.stock{margin-top:22px;padding:14px;background:#f8fafc;border-radius:8px}</style></head><body><main class="wrap"><a href="dashboard.html">← Dashboard</a><h1>Result Checker PIN Stock</h1><p>Admin only. Paste one PIN per line, or use <code>PIN,SERIAL</code>.</p><form id="uploadForm"><div class="field"><label for="examType">Exam type</label><select id="examType"><option>BECE</option><option>WASSCE</option><option>NOV/DEC</option></select></div><div class="field"><label for="pins">PINs</label><textarea id="pins" required placeholder="1234-5678-9012&#10;1234-5678-9013,SERIAL-001"></textarea></div><button type="submit">Upload PIN stock</button></form><div id="notice" hidden class="notice"></div><div id="stock" class="stock">Loading stock…</div></main><script type="module" src="adminResultPins.js"></script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skaitech - Agent Access & Registration</title>
  
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- HEADER NAVIGATION -->
  <header class="site-header">
    <nav class="container nav-bar">
      <a href="index.html" class="brand-logo">
        <img src="img/logo.png" alt="Skaitech Logo">
        <span class="screen-reader-only">Skaitech</span>
      </a>

      <div>
        <a href="index.html" class="btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.85rem;">
          <i class="fa-solid fa-arrow-left"></i> Home
        </a>
      </div>
    </nav>
  </header>

  <!-- AUTHENTICATION SECTION -->
  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- TAB TOGGLES -->
      <div class="auth-tabs">
        <button id="loginTab" class="auth-tab active" onclick="switchTab('login')">Sign In</button>
        <button id="registerTab" class="auth-tab" onclick="switchTab('register')">Create Agent Account</button>
      </div>

     <!-- 1. LOGIN FORM -->
    <form id="loginForm" class="auth-form" onsubmit="handleRegistration(event)">
      <div class="form-group">
        <label for="loginEmail">Email / Phone Number</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="regName" class="form-input" placeholder="024XXXXXXX or name@email.com" required>
        </div>
      </div>

      <!-- <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
        </div>
      </div> -->
      <label for="password" style="font-size: 0.85rem; color: #4b5563; font-weight: 600; display: block; margin-bottom: 6px;">Password</label>
<div style="position: relative; margin-bottom: 14px;">
    <!-- Password Input -->
    <input type="password" id="passwordInput" placeholder="••••••••" style="width: 100%; padding: 12px 40px 12px 36px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 0.95rem; box-sizing: border-box; outline: none;">
    
    <!-- Lock Icon on the Left -->
    <i class="fa-solid fa-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 0.9rem;"></i>
    
    <!-- Eye Icon Toggle Button on the Right -->
    <span onclick="togglePasswordVisibility()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #9ca3af;">
        <i id="eyeIcon" class="fa-solid fa-eye"></i>
    </span>
</div>

      <div class="form-actions">
        <!-- <a href="#" class="forgot-link">Forgot password?</a> -->
         <a href="#" onclick="openForgotModal(event)" style="color: #2563eb; font-size: 0.85rem; text-decoration: none;">Forgot password?</a>
      </div>

      <button type="submit" class="btn-auth">Sign In to Dashboard</button>
    </form> 
     <!-- 2. REGISTER FORM -->
    <form id="registerForm" class="auth-form hidden-form" onsubmit="handleRegistration(event)">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="regName" class="form-input" placeholder="e.g. Mobiri Seidu" required>
        </div>
      </div>

      <div class="form-group">
        <label for="regPhone">Ghanaian Phone Number</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-phone"></i>
          <input type="tel" id="regPhone" class="form-input" placeholder="05XXXXXXXX" required>
        </div>
      </div>

      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="regEmail" class="form-input" placeholder="name@domain.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="regPassword" class="form-input" placeholder="Minimum 6 characters" minlength="6" required>
        </div>
      </div>

      <button type="submit" class="btn-auth">Sign Up</button>
      <div style="text-align: center; margin-top: 16px; font-size: 0.9rem; color: #4b5563;">
        Already have an account? <a href="#" onclick="switchTab('signin')" style="color: #2563eb; font-weight: 600; text-decoration: none;">Sign In</a>
    </div>
    </form>
      
    

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="currentYear"></span> Skaitech. Data | Networks | Solutions.</p>
    </div>
  </footer>

  
  </script>
  <div id="forgotPasswordModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); box-sizing: border-box;">
        <h3 style="margin-top: 0; color: #1f2937;">Reset Password</h3>
        <p style="font-size: 0.85rem; color: #6b7280;">Enter your registered email or phone number and we'll send you instructions to reset your password.</p>
        
        <input type="text" id="resetEmailOrPhone" placeholder="Email or Phone Number" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; margin-bottom: 16px; box-sizing: border-box; outline: none;">
        
        <div style="display: flex; gap: 10px;">
            <button onclick="closeForgotModal()" style="flex: 1; background: #f3f4f6; color: #374151; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer;">Cancel</button>
            <button onclick="submitPasswordReset()" style="flex: 1; background: #2563eb; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer;">Send Reset Link</button>
        </div>
    </div>
</div>
</body>
<!-- ALL LOGIC HANDLED IN EXTERNAL SCRIPT -->
  <script src="script.js"></script>
</body>
</html>
</html>
